name: Daily Facebook Raasi Palan Poster

on:
  schedule:
    # 06:00 AM IST (Indian Standard Time is UTC + 5:30) -> 00:30 AM UTC
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions web tab anytime

jobs:
  publish-raasi-palan:
    name: Publish 12 Rashis to Facebook
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger Cloud Raasi Palan Auto-Poster
        run: |
          echo "==========================================================="
          echo "Triggering Daily KP Raasi Palan for All 12 Rashis to Facebook"
          echo "Target Time: 06:00 AM IST"
          echo "==========================================================="

          # Request publication for all 12 rashis from the live backend
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://gai-astrology-backend.onrender.com/api/v1/social/facebook/publish" \
            -H "Content-Type: application/json" \
            -d '{"rashi": "all"}' \
            --max-time 600)

          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Response Body: $BODY"
          echo "HTTP Status Code: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Successfully triggered and published to Facebook!"
            exit 0
          else
            echo "Failed to publish to Facebook. HTTP Status: $STATUS"
            exit 1
          fi
